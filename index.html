<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Incidencia - CD MASS</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h2>📷 Registro de Incidencia</h2>
            <div class="header-btns">
                <a href="reportes.html" class="btn-secondary">📋 Ver Historial</a>
            </div>
        </div>
        
        <form id="incidenciaForm">
            <!-- FOTO 1: PACKING LIST / ETIQUETA -->
            <div class="form-group">
                <label>Foto 1: Packing List / Etiqueta (Escaneo OCR)</label>

                <input type="file" id="foto_packing_cam" accept="image/*" capture="environment" style="display:none">
                <input type="file" id="foto_packing_gal" accept="image/*" style="display:none">

                <div class="btn-group-foto">
                    <button type="button" class="btn-foto" id="btn_packing_cam">📸 Toma Foto</button>
                    <button type="button" class="btn-foto btn-foto-sec" id="btn_packing_gal">📁 Galería</button>
                </div>

                <div id="preview_packing" class="foto-info-box" style="display:none;"></div>
                <small id="estado_escaneo" class="estado-texto"></small>
            </div>

            <div class="form-group">
                <label>Fecha Validador (Etiqueta):</label>
                <input type="text" id="fecha_validador" placeholder="Ej. 06/10/26" required>
            </div>

            <div class="form-group">
                <label>Auditor / Inspector:</label>
                <input type="text" id="auditor" placeholder="Ej. ENRIQUE BOLIVAR" required>
            </div>

            <div class="form-group">
                <label>Turno:</label>
                <input type="text" id="turno" placeholder="Ej. TARDE" required>
            </div>

            <div class="form-group">
                <label>Nro. Pallet:</label>
                <input type="text" id="nro_pallet" placeholder="Ej. 01PL96200411076" required>
            </div>

            <div class="form-group">
                <label>Cód. Tienda:</label>
                <input type="text" id="cod_tienda" placeholder="Ej. 2346" required>
            </div>

            <div class="form-group">
                <label>Nombre de Tienda / Destino:</label>
                <input type="text" id="nombre_tienda" placeholder="Ej. SPSA INDEC18 TRU MS" required>
            </div>

            <!-- FOTO 2: PALLET FÍSICO COMPLETO -->
            <div class="form-group">
                <label>Foto 2: Pallet Físico Completo</label>

                <input type="file" id="foto_pallet_cam" accept="image/*" capture="environment" style="display:none">
                <input type="file" id="foto_pallet_gal" accept="image/*" style="display:none">

                <div class="btn-group-foto">
                    <button type="button" class="btn-foto" id="btn_pallet_cam">📸 Toma Foto</button>
                    <button type="button" class="btn-foto btn-foto-sec" id="btn_pallet_gal">📁 Galería</button>
                </div>

                <div id="preview_pallet" class="foto-info-box" style="display:none;"></div>
            </div>

            <div class="form-group">
                <label>Descripción de la Incidencia:</label>
                <textarea id="descripcion" rows="3" placeholder="Ej. Cajas aplastadas en la base, mercadería ladeada, film roto..." required></textarea>
            </div>

            <button type="submit" id="btnGuardar" class="btn">Guardar Incidencia</button>
        </form>
    </div>

    <!-- Scripts Modulares -->
    <script src="static/js/config.js"></script>
    <script src="static/js/auth.js"></script>
    <script src="static/js/ocr.js"></script>
    <script src="static/js/app.js"></script>
</body>
</html>
